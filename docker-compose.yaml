services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    # Forwards stop signals to node so the container shuts down promptly
    init: true
    environment:
      DATABASE_URL: file:/data/hangout.db
      UPLOADS_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  api-data:
